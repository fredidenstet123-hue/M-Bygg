
<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>M-Bygg | Stockholm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Montserrat:wght@300;400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      :root {
        --stone-dark: #1C1917;
        --gold: #CA8A04;
        --cream: #FAFAF9;
        --warm-black: #292524;
        --taupe: #78716C;
      }
      
      body {
        background-color: var(--cream);
        color: var(--warm-black);
        font-family: 'Montserrat', sans-serif;
      }

      .font-heading { font-family: 'Playfair Display', serif; }
      .font-accent { font-family: 'Cormorant Garamond', serif; }

      /* Northern Lights Mesh Gradient Effect */
      .mesh-gradient {
        background-color: var(--stone-dark);
        background-image: 
          radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
          radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
          radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%), 
          radial-gradient(at 0% 100%, hsla(167,40%,20%,1) 0, transparent 50%), 
          radial-gradient(at 50% 100%, hsla(25,30%,20%,1) 0, transparent 50%), 
          radial-gradient(at 100% 100%, hsla(202,50%,30%,1) 0, transparent 50%);
        background-size: 200% 200%;
        animation: mesh-animation 15s ease infinite;
      }

      @keyframes mesh-animation {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      /* Transitions and Hover Effects */
      .hover-lift {
        transition: transform 300ms cubic-bezier(0.4, 0, 0.2, 1), box-shadow 300ms cubic-bezier(0.4, 0, 0.2, 1);
      }
      .hover-lift:hover {
        transform: translateY(-4px) scale(1.02);
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      }

      .btn-gold {
        background-color: var(--gold);
        color: white;
        transition: all 300ms cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 0 0 0 rgba(202, 138, 4, 0);
      }
      .btn-gold:hover {
        transform: scale(1.05);
        box-shadow: 0 0 20px rgba(202, 138, 4, 0.4);
        filter: brightness(1.1);
      }

      .shimmer {
        background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite ease-in-out;
      }
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }

      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: var(--cream); }
      ::-webkit-scrollbar-thumb { background: var(--taupe); border-radius: 4px; }
      
      html { scroll-behavior: smooth; }
    </style>
